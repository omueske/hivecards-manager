<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Set Token</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function(){
        const params = new URLSearchParams(location.search)
        const token = params.get('token')
        const dest = params.get('dest') || '/'
        if (token) {
          try {
            // modern flow stores refresh indicator; this page is a dev helper
            localStorage.setItem('hc_has_refresh', '1')
            console.log('refresh-flag set')
          } catch (e) {
            console.error('failed to set refresh flag', e)
          }
        }
        location.replace(dest)
      })()
    </script>
  </head>
  <body>
    <p>Setting token and redirecting...</p>
  </body>
</html>
