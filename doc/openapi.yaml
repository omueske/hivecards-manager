openapi: 3.0.3
info:
  title: Hivecards Manager API
  version: 0.2.0
  description: API for managing apiaries, hives, queens and hive log entries (inspections, treatments, feedings, harvests)
servers:
  - url: http://localhost:3000
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    #  Auth 
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string, minLength: 8 }
        username: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string }

    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
      example:
        accessToken: "eyJhbGciOiJIUzI1Ni..."

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:    { type: string }
        password: { type: string, minLength: 8 }

    #  User 
    User:
      type: object
      properties:
        id:       { type: string }
        email:    { type: string, format: email }
        username: { type: string }
      example:
        id: "607f1f77bcf86cd799439011"
        email: "imker@example.com"
        username: "Imker"

    UpdateUserRequest:
      type: object
      properties:
        username: { type: string }
        email:    { type: string, format: email }
        password: { type: string, minLength: 8 }

    #  Apiary 
    Apiary:
      type: object
      properties:
        id:        { type: string }
        name:      { type: string }
        location:  { type: string }
        notes:     { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      example:
        id: "607f1f77bcf86cd799439022"
        name: "Stadtimkerei Nord"
        location: "Hamburg"

    CreateApiaryRequest:
      type: object
      required: [name]
      properties:
        name:     { type: string }
        location: { type: string }
        notes:    { type: string }

    #  Hive 
    Hive:
      type: object
      properties:
        id:               { type: string }
        apiaryId:         { type: string }
        hiveNumber:       { type: string }
        status:           { type: string, enum: [active, inactive, archived] }
        frameCount:       { type: integer }
        installationDate: { type: string, format: date }
        notes:            { type: string }
        hiveBoxType:      { type: string }
        hiveType:         { type: string }
        queenYear:        { type: integer }
        queenColor:       { type: string }
        queenOrigin:      { type: string }
        matingType:       { type: string }
        queenMarked:      { type: boolean }
        createdAt:        { type: string, format: date-time }
        updatedAt:        { type: string, format: date-time }
      example:
        id: "624b2f9a9c0a4b6e8f7d1234"
        apiaryId: "607f1f77bcf86cd799439022"
        hiveNumber: "A-12"
        status: "active"
        frameCount: 20
        hiveType: "Wirtschaftsvolk"

    CreateHiveRequest:
      type: object
      required: [hiveNumber]
      properties:
        apiaryId:         { type: string }
        hiveNumber:       { type: string }
        status:           { type: string, enum: [active, inactive, archived], default: active }
        frameCount:       { type: integer, default: 20 }
        installationDate: { type: string, format: date }
        notes:            { type: string }
        hiveBoxType:      { type: string }
        hiveType:         { type: string }
        queenYear:        { type: integer }
        queenColor:       { type: string }
        queenOrigin:      { type: string }
        matingType:       { type: string }
        queenMarked:      { type: boolean }

    #  Queen 
    HiveHistoryEntry:
      type: object
      properties:
        hiveId: { type: string }
        from:   { type: string, format: date-time }
        to:     { type: string, format: date-time, nullable: true }

    Queen:
      type: object
      properties:
        id:          { type: string }
        name:        { type: string }
        queenYear:   { type: integer }
        queenColor:  { type: string }
        queenOrigin: { type: string }
        matingType:  { type: string }
        queenMarked: { type: boolean }
        status:      { type: string, enum: [active, spare, dead, sold] }
        notes:       { type: string }
        hiveHistory:
          type: array
          items:
            $ref: '#/components/schemas/HiveHistoryEntry'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      example:
        id: "70bb3f77bcf86cd799439099"
        queenYear: 2025
        queenColor: "weiss"
        status: "active"
        queenMarked: true

    CreateQueenRequest:
      type: object
      properties:
        name:        { type: string }
        queenYear:   { type: integer }
        queenColor:  { type: string }
        queenOrigin: { type: string }
        matingType:  { type: string }
        queenMarked: { type: boolean }
        status:      { type: string, enum: [active, spare, dead, sold], default: spare }
        notes:       { type: string }

    AssignQueenRequest:
      type: object
      required: [hiveId]
      properties:
        hiveId: { type: string }
        from:   { type: string, format: date-time, description: "Defaults to now" }

    RemoveQueenFromHiveRequest:
      type: object
      properties:
        to: { type: string, format: date-time, description: "Defaults to now" }

    #  Inspection / Stockkarte 
    Inspection:
      type: object
      properties:
        id:              { type: string }
        hiveId:          { type: string }
        date:            { type: string, format: date }
        time:            { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$", nullable: true }
        type:
          type: string
          enum: [inspection, treatment, feeding, harvest, note]
          default: note
        notes:           { type: string }
        weather:         { type: string }
        # --- inspection ---
        queenSeen:       { type: boolean }
        broodStatus:     { type: string, description: "Derived from brood checkboxes, e.g. 'Ei, Larve, Verdeckelt'" }
        varroaCount:     { type: number, description: "Natural mite drop per day" }
        frameCount:      { type: integer }
        # --- treatment ---
        treatmentAgent:  { type: string }
        treatmentAmount: { type: string }
        # --- feeding ---
        feedingAgent:    { type: string }
        feedingAmount:   { type: string }
        # --- harvest ---
        harvestAmount:   { type: string }
        createdAt:       { type: string, format: date-time }
        updatedAt:       { type: string, format: date-time }
      example:
        id: "b1ff3f77bcf86cd7994390dd"
        hiveId: "624b2f9a9c0a4b6e8f7d1234"
        date: "2026-02-22"
        time: "10:30"
        type: "treatment"
        treatmentAgent: "Ameisensaeure 60%"
        treatmentAmount: "150 ml"
        varroaCount: 3

    CreateInspectionRequest:
      type: object
      required: [hiveId, date]
      properties:
        hiveId:          { type: string }
        date:            { type: string, format: date }
        time:            { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
        type:            { type: string, enum: [inspection, treatment, feeding, harvest, note], default: note }
        notes:           { type: string }
        weather:         { type: string }
        queenSeen:       { type: boolean }
        broodStatus:     { type: string }
        varroaCount:     { type: number }
        frameCount:      { type: integer }
        treatmentAgent:  { type: string }
        treatmentAmount: { type: string }
        feedingAgent:    { type: string }
        feedingAmount:   { type: string }
        harvestAmount:   { type: string }

    #  Bestandsbuch (Arzneimittel) 
    BestandsbuchEntry:
      type: object
      properties:
        id:                  { type: string }
        userId:              { type: string }
        inspectionId:        { type: string }
        hiveId:              { type: string }
        year:                { type: integer }
        beekeeperName:       { type: string }
        streetHouseNumber:   { type: string }
        postalCode:          { type: string }
        city:                { type: string }
        phone:               { type: string }
        apiaryName:          { type: string }
        operationNumber:     { type: string }
        sheetNumber:         { type: integer }
        sequenceNo:          { type: integer }
        applicationDate:     { type: string, format: date }
        hiveLabel:           { type: string }
        medicineName:        { type: string }
        supplierNameAddress: { type: string }
        administrationType:  { type: string }
        amount:              { type: string }
        withdrawalPeriod:    { type: string }
        treatedBy:           { type: string }
        prescribingVet:      { type: string }
        purchaseReceipt:     { type: string }
        treatmentDuration:   { type: string }
        notes:               { type: string }
        source:              { type: string, enum: [manual, inspection-sync] }
        createdAt:           { type: string, format: date-time }
        updatedAt:           { type: string, format: date-time }
      example:
        id: "66bb3f77bcf86cd7994390ee"
        hiveId: "624b2f9a9c0a4b6e8f7d1234"
        applicationDate: "2026-03-03"
        year: 2026
        sequenceNo: 1
        medicineName: "Ameisensaeure 60%"
        amount: "150 ml"
        administrationType: "verdunsten"
        treatedBy: "Max Mustermann"

    CreateBestandsbuchEntryRequest:
      type: object
      properties:
        source:              { type: string, enum: [manual, inspection-sync], default: manual }
        inspectionId:        { type: string }
        hiveId:              { type: string }
        beekeeperName:       { type: string }
        streetHouseNumber:   { type: string }
        postalCode:          { type: string }
        city:                { type: string }
        phone:               { type: string }
        apiaryName:          { type: string }
        operationNumber:     { type: string }
        sheetNumber:         { type: integer, minimum: 1, maximum: 999 }
        sequenceNo:          { type: integer, minimum: 1, maximum: 9999 }
        applicationDate:     { type: string, format: date }
        year:                { type: integer, minimum: 2000, maximum: 2100 }
        hiveLabel:           { type: string }
        medicineName:        { type: string }
        supplierNameAddress: { type: string }
        administrationType:  { type: string }
        amount:              { type: string }
        withdrawalPeriod:    { type: string }
        treatedBy:           { type: string }
        prescribingVet:      { type: string }
        purchaseReceipt:     { type: string }
        treatmentDuration:   { type: string }
        notes:               { type: string }

    #  Treatment Agents 
    TreatmentAgent:
      type: object
      properties:
        id:       { type: string }
        name:     { type: string }
        category: { type: string, enum: [treatment, feeding], default: treatment }
      example:
        id: "66aa1f77bcf86cd799432201"
        name: "Varromed"
        category: "treatment"

    CreateTreatmentAgentRequest:
      type: object
      required: [name]
      properties:
        name:     { type: string, maxLength: 100 }
        category: { type: string, enum: [treatment, feeding], default: treatment }

    #  Common 
    PaginatedResponse:
      type: object
      properties:
        pagination:
          type: object
          properties:
            page:  { type: integer }
            limit: { type: integer }
            total: { type: integer }
        items:
          type: array
          items: {}

    Error:
      type: object
      properties:
        code:    { type: integer }
        message: { type: string }
      example:
        code: 400
        message: "Invalid request payload"

  responses:
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    page:
      name: page
      in: query
      schema: { type: integer, default: 1 }
    limit:
      name: limit
      in: query
      schema: { type: integer, default: 25 }
    hiveId:
      name: hiveId
      in: query
      schema: { type: string }

# 
# Paths
# 
paths:

  #  Auth 
  /api/v1/auth/register:
    post:
      summary: Register a new user
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User registered (email verification sent)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/login:
    post:
      summary: Login  returns access token; sets HttpOnly refresh cookie
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Access token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/refresh:
    post:
      summary: Refresh access token using HttpOnly refresh cookie
      security: []
      tags: [Auth]
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '204':
          description: No refresh cookie present or token invalid

  /api/v1/auth/logout:
    post:
      summary: Logout  clears refresh cookie
      security: []
      tags: [Auth]
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /api/v1/auth/forgot-password:
    post:
      summary: Request password reset email
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '200':
          description: Email sent (always returns 200 to avoid enumeration)

  /api/v1/auth/reset-password:
    post:
      summary: Reset password with token from email
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: Password reset successful
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/verify-email:
    get:
      summary: Verify email address (redirect link from email)
      security: []
      tags: [Auth]
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirects to /email-verified on success

  #  Users 
  /api/v1/users/me:
    get:
      summary: Get current user profile
      tags: [Users]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Update current user profile
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  #  Apiaries 
  /api/v1/apiaries:
    get:
      summary: List all apiaries of the current user
      tags: [Apiaries]
      responses:
        '200':
          description: List of apiaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Apiary' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a new apiary
      tags: [Apiaries]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApiaryRequest' }
      responses:
        '201':
          description: Created apiary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Apiary' }

  /api/v1/apiaries/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Get a single apiary
      tags: [Apiaries]
      responses:
        '200':
          description: Apiary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Apiary' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update an apiary
      tags: [Apiaries]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApiaryRequest' }
      responses:
        '200':
          description: Updated apiary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Apiary' }
    delete:
      summary: Delete an apiary
      tags: [Apiaries]
      responses:
        '200':
          description: Deleted

  #  Hives 
  /api/v1/hives:
    get:
      summary: List hives (optionally filtered by apiaryId / status)
      tags: [Hives]
      parameters:
        - $ref: '#/components/parameters/hiveId'
        - name: apiaryId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive, archived] }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Paginated list of hives
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedResponse' }
    post:
      summary: Create a new hive
      tags: [Hives]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateHiveRequest' }
      responses:
        '201':
          description: Created hive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hive' }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/hives/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Get a single hive
      tags: [Hives]
      responses:
        '200':
          description: Hive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hive' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a hive
      tags: [Hives]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateHiveRequest' }
      responses:
        '200':
          description: Updated hive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hive' }
    delete:
      summary: Archive / delete a hive
      tags: [Hives]
      responses:
        '200':
          description: Archived

  #  Queens 
  /api/v1/queens:
    get:
      summary: List queens (all or filtered by hiveId)
      tags: [Queens]
      parameters:
        - name: hiveId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: List of queens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Queen' }
    post:
      summary: Create a new queen
      tags: [Queens]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQueenRequest' }
      responses:
        '201':
          description: Created queen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Queen' }

  /api/v1/queens/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Get a single queen
      tags: [Queens]
      responses:
        '200':
          description: Queen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Queen' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a queen
      tags: [Queens]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQueenRequest' }
      responses:
        '200':
          description: Updated queen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Queen' }
    delete:
      summary: Delete a queen
      tags: [Queens]
      responses:
        '204':
          description: Deleted

  /api/v1/queens/{id}/assign:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      summary: Assign queen to a hive
      tags: [Queens]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignQueenRequest' }
      responses:
        '200':
          description: Updated queen with hiveHistory entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Queen' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/queens/{id}/remove-from-hive:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      summary: Remove queen from current hive (status -> spare)
      tags: [Queens]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemoveQueenFromHiveRequest' }
      responses:
        '200':
          description: Updated queen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Queen' }

  #  Inspections / Stockkarte 
  /api/v1/inspections:
    get:
      summary: List inspections (filtered by hiveId, paginated)
      tags: [Inspections]
      parameters:
        - $ref: '#/components/parameters/hiveId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Paginated list of inspections
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedResponse' }
    post:
      summary: Create a new log entry
      tags: [Inspections]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInspectionRequest' }
      responses:
        '201':
          description: Created entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inspection' }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/inspections/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    put:
      summary: Update a log entry
      tags: [Inspections]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInspectionRequest' }
      responses:
        '200':
          description: Updated entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inspection' }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a log entry
      tags: [Inspections]
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  #  Bestandsbuch (Arzneimittel) 
  /api/v1/bestandsbuch:
    get:
      summary: List bestandsbuch entries (optionally filtered by year/hiveId)
      tags: [Bestandsbuch]
      parameters:
        - name: year
          in: query
          schema: { type: integer }
        - name: hiveId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: List of bestandsbuch entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BestandsbuchEntry' }
    post:
