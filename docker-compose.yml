services:
  # ── Application ─────────────────────────────────────────────────────────────
  app:
    image: hivecards-local
    # Remote image (CI/CD):
    # image: ghcr.io/omueske/hivecards-manager:main
    # Build from source:
    # build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # App
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}  # Public URL — set in .env for production!
      SERVE_ROOT: ""            # Subpath if behind a reverse proxy, e.g. /hivecards-manager
      CORS_ORIGIN: "http://olli-home.duckdns.org:3000"  # Extra allowed origins (comma-separated); empty = only same-origin
      # Logging – one of: FATAL | ERROR | WARN | INFO | DEBUG  (default: INFO)
      LOG_LEVEL: "DEBUG"
      # Database
      MONGODB_URI: mongodb://mongo:27017/hivecards
      # Auth
      JWT_SECRET: changeme_in_production
      # Set to true only when serving over HTTPS (prevents cookie being sent over plain HTTP)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Mail – set values in .env (see .env.example)
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-"Hivecards <noreply@hivecards.local>"}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}

    depends_on:
      - mongo

  # ── Infrastructure ───────────────────────────────────────────────────────────
  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - '27018:27017'
    volumes:
      - mongo-data:/data/db
  mongo-express:
    image: mongo-express:1.0.0
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
    depends_on:
      - mongo
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # Web UI (http://localhost:8025)
volumes:
  mongo-data:
