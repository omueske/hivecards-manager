services:
  # ── Application ─────────────────────────────────────────────────────────────
  app:
    image: ghcr.io/omueske/hivecards-manager:main
    # Local development: build from source instead:
    # build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      MONGODB_URI: mongodb://mongo:27017/hivecards
      JWT_SECRET: changeme_in_production
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      - mongo
      - mailpit

  # ── Infrastructure ───────────────────────────────────────────────────────────
  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - '27018:27017'
    volumes:
      - mongo-data:/data/db
  mongo-express:
    image: mongo-express:1.0.0
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
    depends_on:
      - mongo
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # Web UI (http://localhost:8025)
volumes:
  mongo-data:
